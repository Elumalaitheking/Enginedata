<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engine Records Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="row between">
          <div>
            <h1>Engine Records Manager</h1>
            <p>Store, search, and maintain engine records with image history.</p>
          </div>
          <a class="btn" href="/list.html">Open Engine List Page</a>
        </div>
      </header>

      <section class="card">
        <h2>Add Engine</h2>
        <form id="engineForm" class="form-grid">
          <input name="engineName" placeholder="Engine Name *" required />
          <input name="airFilter" placeholder="Air Filter" />
          <input name="lastLoadedTestbed" type="date" />
          <textarea name="remarks" placeholder="Remarks"></textarea>
          <input id="images" name="images" type="file" accept="image/*" multiple />
          <button class="btn btn-primary" type="submit">Add</button>
        </form>
        <p id="formMessage" class="msg"></p>
      </section>

      <section class="card">
        <h2>Search & Quick List</h2>
        <div class="row">
          <input id="searchInput" placeholder="Search by engine name" />
          <button id="searchBtn" class="btn">Search</button>
        </div>
        <p id="searchMessage" class="msg"></p>
        <ul id="engineList" class="engine-list"></ul>
      </section>

      <section class="card">
        <div class="row between">
          <h2>Details</h2>
          <div class="row">
            <button id="editBtn" class="btn" disabled>Edit</button>
            <button id="deleteBtn" class="btn btn-danger" disabled>Delete</button>
          </div>
        </div>
        <div id="engineDetails" class="empty">Select an engine to view details.</div>
      </section>
    </div>

    <div id="imageModal" class="modal" aria-hidden="true">
      <button id="closeModal" class="modal-close">✕</button>
      <img id="modalImage" alt="Zoomed engine image" />
    </div>

    <div id="editModal" class="modal" aria-hidden="true">
      <div class="dialog">
        <h3>Edit Engine</h3>
        <form id="editForm" class="form-grid">
          <input name="engineName" placeholder="Engine Name *" required />
          <input name="airFilter" placeholder="Air Filter" />
          <input name="lastLoadedTestbed" type="date" />
          <textarea name="remarks" placeholder="Remarks"></textarea>
          <label>Upload new images (optional): <input name="images" type="file" accept="image/*" multiple /></label>
          <div id="existingImages" class="gallery"></div>
          <div class="row">
            <button class="btn btn-primary" type="submit">Save</button>
            <button id="cancelEdit" class="btn" type="button">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
